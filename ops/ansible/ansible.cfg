# Run from this directory: uv run --group ops ansible-playbook playbooks/<name>.yml
[defaults]
inventory = inventory.py
remote_user = tmc
host_key_checking = True
retry_files_enabled = False
nocows = True
inject_facts_as_vars = False
stdout_callback = default
result_format = yaml
interpreter_python = /usr/bin/python3
forks = 4

[ssh_connection]
pipelining = True
# reuse the platform's own SSH connections where they are open
ssh_args = -o ControlMaster=auto -o ControlPersist=10m -o StrictHostKeyChecking=accept-new -o ConnectTimeout=6
