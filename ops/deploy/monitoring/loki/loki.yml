# Loki single binary on Node-3. HTTP and gRPC listen on localhost only; the nginx proxy on :3100 is the
# only way in, and it enforces separate push and query credentials (see nginx.conf).
auth_enabled: false
server:
  http_listen_address: 127.0.0.1
  http_listen_port: 3101
  grpc_listen_address: 127.0.0.1
  grpc_listen_port: 9096
  log_level: warn
common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  ring: {kvstore: {store: inmemory}}
  storage:
    filesystem: {chunks_directory: /loki/chunks, rules_directory: /loki/rules}
schema_config:
  configs:
    - {from: "2026-01-01", store: tsdb, object_store: filesystem, schema: v13, index: {prefix: index_, period: 24h}}
compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
limits_config:
  retention_period: 336h              # 14 days
  max_query_length: 721h
  max_query_lookback: 336h
  max_entries_limit_per_query: 2000
  max_query_series: 2000
  query_timeout: 30s
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32
  per_stream_rate_limit: 8MB
  per_stream_rate_limit_burst: 16MB
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  volume_enabled: true
analytics: {reporting_enabled: false}
