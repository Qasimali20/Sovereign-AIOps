# Authenticating front door for Loki: collectors may only push, readers may only query.
worker_processes 1;
events { worker_connections 1024; }
http {
  access_log off;
  client_max_body_size 32m;
  server {
    listen 0.0.0.0:3100;
    location = /ready { proxy_pass http://127.0.0.1:3101; }
    location = /loki/api/v1/push {
      auth_basic "loki-push"; auth_basic_user_file /etc/nginx/htpasswd-push;
      proxy_pass http://127.0.0.1:3101;
    }
    location ~ ^/loki/api/v1/(query|query_range|labels|label/[^/]+/values|series|index/stats|index/volume|index/volume_range|detected_fields|detected_labels|patterns)$ {
      auth_basic "loki-query"; auth_basic_user_file /etc/nginx/htpasswd-query;
      proxy_pass http://127.0.0.1:3101; proxy_read_timeout 35s;
    }
    location /loki/api/v1/status/buildinfo { auth_basic "loki-query"; auth_basic_user_file /etc/nginx/htpasswd-query; proxy_pass http://127.0.0.1:3101; }
    location / { return 403; }
  }
}
