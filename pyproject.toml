[project]
name = "aiops"
version = "0.1.0"
description = "Self-hosted AIOps, LLMOps and AgentOps platform for an on-premises GPU cluster"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.7",
    "httpx>=0.28.1",
    "langgraph>=1.2.22",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "pydantic>=2.14.3",
    "python-multipart>=0.0.33",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
ops = [
    "ansible-core>=2.21.6",
]

[tool.pytest.ini_options]
pythonpath = ["."]
